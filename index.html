<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b5232f"><title>Nannetti Gestão</title><style>
:root{--red:#b5232f;--dark:#262626;--bg:#f5f5f6;--white:#fff;--muted:#737373;--green:#16834b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--dark)}header{background:var(--red);color:white;padding:18px 16px 20px;position:sticky;top:0;z-index:2;box-shadow:0 3px 10px #0002}header h1{margin:0;font-size:22px}header small{opacity:.9}.wrap{max-width:950px;margin:auto;padding:14px}.nav{display:flex;gap:8px;overflow:auto;margin:0 0 14px}.nav button{border:0;border-radius:12px;background:white;padding:12px 14px;font-weight:700;white-space:nowrap;color:#333}.nav button.active{background:var(--red);color:white}.panel{background:white;border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 2px 8px #0000000a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:14px;border-radius:14px;background:#f7e7e8}.stat:nth-child(2){background:#e8f2eb}.stat:nth-child(3){background:#e8eef8}.stat:nth-child(4){background:#f4eee4}.stat small{color:#555}.stat strong{display:block;font-size:23px;margin-top:4px}.btn{border:0;background:var(--red);color:white;font-weight:700;border-radius:12px;padding:12px 15px;cursor:pointer}.btn.secondary{background:#eee;color:#333}.btn.green{background:var(--green)}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:white;font:inherit;margin:5px 0 10px}label{font-size:13px;font-weight:700;color:#555}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #eee}th{color:#666}td:last-child,th:last-child{text-align:right}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.pill{display:inline-block;background:#eee;border-radius:20px;padding:4px 8px;font-size:12px}.item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.item button{padding:6px 10px}.empty{color:var(--muted);text-align:center;padding:25px}.notice{background:#fff6dc;border-radius:12px;padding:12px;font-size:13px}.foot{font-size:12px;color:#888;text-align:center;padding:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>

</head><body><header><h1>◐ NANNETTI</h1><small>Gestão • Fábrica de pães • Offline</small></header><main class="wrap"><nav class="nav" id="nav"></nav><section id="view"></section><div class="foot">Dados salvos localmente neste dispositivo. Faça backups regularmente.</div></main><script>
const defaultProducts=[['Pão Hot Dog 250g',0,0],['Pão Hot Dog 500g',0,0],['Bisnaguinha 250g',0,0],['Pão de Forma 450g',0,0],['Pão de Leite 450g',0,0]];let db=JSON.parse(localStorage.getItem('nannetti_db')||'null')||{products:defaultProducts.map((p,i)=>({id:i+1,name:p[0],price:p[1],stock:p[2]})),customers:[],sales:[],production:[],cash:[]};function save(){localStorage.setItem('nannetti_db',JSON.stringify(db))}const tabs=['Painel','Vendas','Produtos','Clientes','Produção','Relatórios','Backup'];let current='Painel';function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${current===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('')}function go(t){current=t;nav();render()}function render(){let v=document.getElementById('view');if(current==='Painel'){let today=new Date().toLocaleDateString('pt-BR'),sales=db.sales.filter(s=>new Date(s.date).toLocaleDateString('pt-BR')===today),total=sales.reduce((a,s)=>a+s.total,0);v.innerHTML=`<div class="grid"><div class="stat"><small>Vendas hoje</small><strong>${money(total)}</strong></div><div class="stat"><small>Pedidos hoje</small><strong>${sales.length}</strong></div><div class="stat"><small>Produtos cadastrados</small><strong>${db.products.length}</strong></div><div class="stat"><small>Clientes</small><strong>${db.customers.length}</strong></div></div><div class="panel"><h3>Atalhos</h3><div class="actions"><button class="btn" onclick="go('Vendas')">＋ Nova venda</button><button class="btn secondary" onclick="go('Produção')">＋ Registrar produção</button><button class="btn secondary" onclick="go('Produtos')">Produtos / estoque</button></div></div><div class="panel"><h3>Estoque atual</h3>${productTable()}</div>`}
else if(current==='Produtos'){v.innerHTML=`<div class="panel"><h3>Cadastro de produto</h3><label>Nome</label><input id="pname" placeholder="Nome do produto"><div class="row"><div><label>Preço de venda (R$)</label><input id="pprice" type="number" step="0.01" min="0"></div><div><label>Estoque inicial</label><input id="pstock" type="number" step="1" min="0"></div></div><button class="btn" onclick="addProduct()">Cadastrar produto</button></div><div class="panel"><h3>Produtos cadastrados</h3>${productTable(true)}</div>`}
else if(current==='Clientes'){v.innerHTML=`<div class="panel"><h3>Novo cliente</h3><label>Nome / comércio</label><input id="cname" placeholder="Nome do mercado ou cliente"><label>Telefone</label><input id="cphone" placeholder="Telefone (opcional)"><label>Observações</label><input id="cnote" placeholder="Endereço, rota etc."><button class="btn" onclick="addCustomer()">Cadastrar cliente</button></div><div class="panel"><h3>Clientes</h3>${db.customers.length?db.customers.map(c=>`<div class="item"><div><b>${esc(c.name)}</b><br><small>${esc(c.phone||'')} ${esc(c.note||'')}</small></div><button class="btn secondary" onclick="delCustomer(${c.id})">Excluir</button></div>`).join(''):'<div class="empty">Nenhum cliente cadastrado.</div>'}</div>`}
else if(current==='Vendas'){v.innerHTML=`<div class="panel"><h3>Registrar venda</h3><label>Cliente</label><select id="saleCustomer"><option value="">Venda avulsa</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Produto</label><select id="saleProduct">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (estoque: ${p.stock})</option>`).join('')}</select><div class="row"><div><label>Quantidade</label><input id="saleQty" type="number" value="1" min="1"></div><div style="align-self:end"><button class="btn" onclick="addCart()">Adicionar</button></div></div><div id="cart"></div><label>Forma de pagamento</label><select id="payment"><option>Dinheiro</option><option>PIX</option><option>Cartão</option><option>Fiado</option><option>Outro</option></select><button class="btn green" onclick="finishSale()">Finalizar venda</button></div><div class="panel"><h3>Últimas vendas</h3>${salesTable()}</div>`;drawCart()}
else if(current==='Produção'){v.innerHTML=`<div class="panel"><h3>Registrar produção</h3><label>Produto</label><select id="prodProduct">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><label>Quantidade produzida</label><input id="prodQty" type="number" min="1" value="1"><button class="btn" onclick="addProduction()">Registrar produção</button></div><div class="panel"><h3>Histórico de produção</h3>${db.production.length?`<table><tr><th>Data</th><th>Produto</th><th>Qtd.</th></tr>${db.production.slice().reverse().map(x=>`<tr><td>${new Date(x.date).toLocaleString('pt-BR')}</td><td>${esc(x.name)}</td><td>${x.qty}</td></tr>`).join('')}</table>`:'<div class="empty">Nenhuma produção registrada.</div>'}</div>`}
else if(current==='Relatórios'){let total=db.sales.reduce((a,s)=>a+s.total,0),units=db.sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0);v.innerHTML=`<div class="grid"><div class="stat"><small>Faturamento total</small><strong>${money(total)}</strong></div><div class="stat"><small>Vendas registradas</small><strong>${db.sales.length}</strong></div><div class="stat"><small>Unidades vendidas</small><strong>${units}</strong></div><div class="stat"><small>Produções</small><strong>${db.production.length}</strong></div></div><div class="panel"><h3>Resumo por produto</h3>${db.products.map(p=>{let q=db.sales.flatMap(s=>s.items).filter(i=>i.id===p.id).reduce((a,i)=>a+i.qty,0);return `<div class="item"><span>${esc(p.name)}</span><b>${q} unidades</b></div>`}).join('')}</div><div class="panel"><h3>Vendas</h3>${salesTable()}</div>`}
else if(current==='Backup'){v.innerHTML=`<div class="panel"><h3>Backup e restauração</h3><p>Exporte seus dados para guardar uma cópia. O arquivo poderá ser restaurado neste aplicativo.</p><button class="btn" onclick="backup()">Exportar backup JSON</button><hr><label>Restaurar backup</label><input type="file" id="restorefile" accept=".json,application/json"><button class="btn secondary" onclick="restore()">Restaurar arquivo</button><p class="notice">A restauração substitui os dados atuais. Faça uma exportação antes.</p></div><div class="panel"><button class="btn secondary" onclick="if(confirm('Apagar todos os dados do app?')){localStorage.removeItem('nannetti_db');location.reload()}" style="color:#b5232f">Apagar todos os dados</button></div>`} }
function productTable(edit=false){return db.products.length?`<table><tr><th>Produto</th><th>Preço</th><th>Estoque</th>${edit?'<th></th>':''}</tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.stock}</td>${edit?`<td><button class="btn secondary" onclick="editProduct(${p.id})">Editar</button> <button class="btn secondary" onclick="delProduct(${p.id})">×</button></td>`:''}</tr>`).join('')}</table>`:'<div class="empty">Nenhum produto.</div>'}function salesTable(){return db.sales.length?`<table><tr><th>Data</th><th>Cliente</th><th>Total</th><th>Pagamento</th><th>Imprimir</th></tr>${db.sales.slice().reverse().slice(0,40).map(s=>`<tr><td>${new Date(s.date).toLocaleString('pt-BR')}</td><td>${esc(s.customer||'Avulso')}</td><td>${money(s.total)}</td><td>${esc(s.payment)}</td><td><button class="btn secondary" onclick="printSale(${s.id})">🖨</button></td></tr>`).join('')}</table>`:'<div class="empty">Nenhuma venda registrada.</div>'}function printSale(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let fontSize=prompt('Tamanho geral das letras (16 a 32). Produtos serão impressos extra grandes:','28');if(fontSize===null)return;fontSize=Math.max(16,Math.min(32,parseInt(fontSize)||24));let old=document.getElementById('printRoot');if(old)old.remove();let root=document.createElement('div');root.id='printRoot';root.innerHTML=`<div class="receipt"><h1>NANNETTI</h1><h3>Comprovante de venda</h3><div>Venda: ${s.id}</div><div>Data: ${new Date(s.date).toLocaleString('pt-BR')}</div><div class="customer">${esc(s.customer||'AVULSO')}</div><div class="line"></div><table><tr><td><b>Produto</b></td><td><b>Qtd.</b></td><td><b>Total</b></td></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}<br><small>${money(i.price)} / un.</small></td><td>${i.qty}</td><td>${money(i.price*i.qty)}</td></tr>`).join('')}</table><div class="line"></div><div class="total">TOTAL: ${money(s.total)}</div><div>Pagamento: ${esc(s.payment)}</div><p class="center">Obrigado pela preferência!</p></div>`;document.body.appendChild(root);let style=document.createElement('style');style.id='printStyle';style.textContent=`#printRoot{display:none}.receipt{font-family:Arial,sans-serif;color:#111;margin:15px;max-width:420px;font-size:${fontSize}px} .receipt h1{text-align:center;margin:0;color:#b5232f;font-size:1.7em}.receipt h3{text-align:center;margin:4px 0 15px;font-size:1.15em}.receipt small{color:#444;font-size:.85em}.receipt .customer{font-size:1.5em;font-weight:900;text-align:center;padding:12px 8px;margin:12px 0;border:3px solid #111;border-radius:8px;background:#eee;line-height:1.25;overflow-wrap:anywhere}.receipt .line{border-top:2px dashed #555;margin:10px 0}.receipt table{width:100%;border-collapse:collapse}.receipt table tr:not(:first-child){border-bottom:1px dotted #777}.receipt table tr:not(:first-child) td{padding:12px 3px 14px;font-size:2.0em;font-weight:900;line-height:1.3}.receipt table tr:first-child td{padding:3px 2px 5px;font-size:.72em;font-weight:700;border-bottom:1px solid #111}.receipt td:last-child{text-align:right;white-space:nowrap;padding-left:18px!important}.receipt td:nth-child(2){text-align:center;white-space:nowrap;padding-right:14px!important;min-width:58px}.receipt table tr:not(:first-child) td:first-child{width:58%}.receipt table tr:not(:first-child) td:nth-child(2){width:17%}.receipt table tr:not(:first-child) td:last-child{width:25%}.receipt small{display:block;font-size:.48em;font-weight:500;margin-top:3px}.receipt .total{font-size:1.45em;font-weight:bold;text-align:right;margin-top:4px;padding-top:4px;border-top:2px solid #111}.receipt .center{text-align:center}@media print{body>*:not(#printRoot){display:none!important}#printRoot{display:block!important}.receipt{margin:0;width:100%;max-width:none} }`;document.head.appendChild(style);let cleanup=()=>{root.remove();style.remove();window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);window.print();setTimeout(cleanup,1500);}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function addProduct(){let n=document.getElementById('pname').value.trim(),price=+document.getElementById('pprice').value,stock=+document.getElementById('pstock').value;if(!n||price<0||!Number.isFinite(price)||stock<0)return alert('Preencha nome, preço e estoque corretamente.');db.products.push({id:Date.now(),name:n,price,stock});save();render()}function editProduct(id){let p=db.products.find(x=>x.id===id),n=prompt('Nome:',p.name);if(n===null)return;let pr=prompt('Preço:',p.price);if(pr===null)return;let st=prompt('Estoque:',p.stock);if(st===null)return;p.name=n.trim()||p.name;p.price=Math.max(0,+pr||0);p.stock=Math.max(0,+st||0);save();render()}function delProduct(id){if(confirm('Excluir produto?')){db.products=db.products.filter(p=>p.id!==id);save();render()}}function addCustomer(){let n=document.getElementById('cname').value.trim();if(!n)return alert('Informe o nome.');db.customers.push({id:Date.now(),name:n,phone:document.getElementById('cphone').value,note:document.getElementById('cnote').value});save();render()}function delCustomer(id){if(confirm('Excluir cliente?')){db.customers=db.customers.filter(c=>c.id!==id);save();render()}}
let cart=[];function addCart(){let id=+document.getElementById('saleProduct').value,p=db.products.find(x=>x.id===id),q=+document.getElementById('saleQty').value;if(!p||q<=0)return alert('Quantidade inválida.');if(q>p.stock)return alert('Estoque insuficiente.');let existing=cart.find(x=>x.id===id);if(existing){if(existing.qty+q>p.stock)return alert('Estoque insuficiente.');existing.qty+=q}else cart.push({id,name:p.name,price:p.price,qty:q});drawCart()}function drawCart(){let el=document.getElementById('cart');if(!el)return;el.innerHTML=cart.length?`<h4>Itens</h4>${cart.map(i=>`<div class="item"><span>${esc(i.name)} × ${i.qty}<br><small>${money(i.price*i.qty)}</small></span><button class="btn secondary" onclick="removeCart(${i.id})">Remover</button></div>`).join('')}<h3>Total: ${money(cart.reduce((a,i)=>a+i.price*i.qty,0))}</h3>`:'<div class="empty">Carrinho vazio.</div>'}function removeCart(id){cart=cart.filter(i=>i.id!==id);drawCart()}function finishSale(){if(!cart.length)return alert('Carrinho vazio.');let c=db.customers.find(x=>x.id===+document.getElementById('saleCustomer').value),payment=document.getElementById('payment').value;for(let i of cart){let p=db.products.find(x=>x.id===i.id);if(i.qty>p.stock)return alert('Estoque insuficiente para '+p.name)}let total=cart.reduce((a,i)=>a+i.price*i.qty,0);db.sales.push({id:Date.now(),date:new Date().toISOString(),customer:c?.name||'Venda avulsa',customerId:c?.id||null,items:cart.map(x=>({...x})),total,payment});cart.forEach(i=>db.products.find(p=>p.id===i.id).stock-=i.qty);db.cash.push({date:new Date().toISOString(),type:'venda',amount:total,payment});cart=[];save();alert('Venda registrada!');render()}function addProduction(){let id=+document.getElementById('prodProduct').value,q=+document.getElementById('prodQty').value,p=db.products.find(x=>x.id===id);if(q<=0)return alert('Quantidade inválida.');p.stock+=q;db.production.push({date:new Date().toISOString(),id,name:p.name,qty:q});save();render()}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nannetti-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}function restore(){let f=document.getElementById('restorefile').files[0];if(!f)return alert('Selecione um arquivo.');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.sales||!d.customers)throw 0;db=d;save();render();alert('Backup restaurado!')}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)}nav();render();
</script></body></html>
